<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Awning Strip Gradient -->
    <linearGradient id="awningLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container Base (Squircle) -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Mart Storefront + Cart Emblem -->
  <g filter="url(#glow)">
    <!-- Store Awning Roof -->
    <path d="M14 23 C14 20.5 16 19 19 19 L45 19 C48 19 50 20.5 50 23 L48.5 28 C48.5 29.5 47 31 45.2 31 C43.4 31 42 29.5 42 28 C42 29.5 40.6 31 38.8 31 C37 31 35.6 29.5 35.6 28 C35.6 29.5 34.2 31 32.4 31 C30.6 31 29.2 29.5 29.2 28 C29.2 29.5 27.8 31 26 31 C24.2 31 22.8 29.5 22.8 28 C22.8 29.5 21.4 31 19.6 31 C17.8 31 16.3 29.5 16.3 28 Z" fill="url(#iconGrad)" />

    <!-- Awning Scallops Highlights -->
    <path d="M19 19 L20 28 M25.6 19 L26.4 28 M32 19 L32 28 M38.4 19 L37.6 28 M45 19 L44 28" stroke="#047857" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round" />

    <!-- Store Pillars / Frame -->
    <path d="M17.5 30.5 L17.5 45 C17.5 46 18.5 47 19.5 47 L44.5 47 C45.5 47 46.5 46 46.5 45 L46.5 30.5" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Modern Shopping Cart Inside Store -->
    <!-- Cart Basket -->
    <path d="M24 35 L40 35 L38 41 L26 41 Z" fill="url(#awningLight)" opacity="0.95" />
    <path d="M22 33 L24 35 L26 41 L38 41 L39.5 36.5" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Cart Wheels -->
    <circle cx="28" cy="43.5" r="1.5" fill="#38bdf8" />
    <circle cx="36" cy="43.5" r="1.5" fill="#38bdf8" />

    <!-- Digital Sparkle / Smart Mart Badge -->
    <path d="M44 14.5 L45 12 L47.5 11 L45 10 L44 7.5 L43 10 L40.5 11 L43 12 Z" fill="#fde047" />
  </g>
</svg>